name: PlatformIO CI/CD

on:
  push:
    branches: [ "software" ] 
  pull_request:
    branches: [ "software" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run Tests
        run: ./mouse test
      - name: Build Firmware
        run: ./mouse build
