[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino

build_unflags = 
    -std=gnu++11

build_flags = 
    -std=gnu++17
    -Wall                   
    -Wextra                 
    -Werror=return-type     
    -O2                     

test_build_src = yes

monitor_speed = 115200

[env:native]
platform = native
test_build_src = no
test_ignore = test_hardware_* 
build_flags = 
    -std=gnu++17
    -D UNIT_TEST
